function getParentAlerts(stList){
  const alerts=[];
  const today=new Date(new Date().toLocaleDateString('en-CA')+'T00:00:00');
  for(const s of (stList||[])){
    const hasPending=(s.renewalRequests||[]).some(r=>r.status==='pending');
    const rem=Number(s.remainingClasses||0);
    if(rem<=2){
      alerts.push({
        sid:s.id,
        studentName:s.name,
        type:'low_classes',
        title:`【堂數不足提醒】${s.name} 目前僅剩 ${rem} 堂課`,
        desc:rem===0?'您的上課堂數已全部使用完畢，為避免影響後續排課，請盡快辦理線上續約。':`您的剩餘堂數僅剩 ${rem} 堂，建議提前辦理線上續約，確保上課權益不中斷。`
      });
    }
    if(/^\d{4}-\d{2}-\d{2}$/.test(s.expiryDate||'') && !hasPending){
      const exp=new Date(s.expiryDate+'T00:00:00');
      const diffDays=Math.ceil((exp-today)/86400000);
      if(diffDays<=14){
        alerts.push({
          sid:s.id,
          studentName:s.name,
          type:'expiring',
          title:diffDays<0?`【方案已到期提醒】${s.name} 方案已於 ${s.expiryDate} 到期`:diffDays===0?`【方案今日到期提醒】${s.name} 方案將於今日（${s.expiryDate}）到期`:`【方案即將到期提醒】${s.name} 方案將於 ${diffDays} 天後（${s.expiryDate}）到期`,
          desc:'系統顯示您尚未提出續約申請，請點擊下方「立即線上續約」完成續約登記。'
        });
      }
    }
  }
  return alerts;
}
